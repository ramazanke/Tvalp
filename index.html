<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <title>Alpica TV</title>
  <link rel="stylesheet" href="style.css?v=20261102">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js" defer></script>
  <script src="channel-store.js?v=20261102" defer></script>
  <script src="app.js?v=20261102" defer></script>
</head>
<body>
  <video id="video" autoplay playsinline></video>
  <div class="shade"></div>
  <header id="hud"><div class="brand">ALPICA<span>TV</span></div><a class="manage-link" data-web-settings href="settings.html">⚙ Ayarlar</a><a class="manage-link" href="admin.html">Kanal yönetimi</a><span id="listState" aria-live="polite"></span><button id="reloadList" type="button">Listeyi yenile</button><div id="clock"></div><button id="fullscreen" aria-label="Tam ekran">⛶</button></header>
  <section id="info"><span id="categoryLabel">CANLI TV</span><h1 id="channelName">Kanallar yükleniyor…</h1><p id="status" role="status" aria-live="polite">Yayın listesi alınıyor</p></section>
  <div id="welcome"><button id="start">▶ İzlemeye başla · Tam ekran</button></div>
  <nav id="touchControls" aria-label="Dokunmatik oynatıcı kontrolleri">
    <button id="touchPrevious" type="button" aria-label="Önceki kanal">‹</button>
    <button id="touchCategories" type="button" aria-controls="categories" aria-expanded="false">☰ Kategoriler</button>
    <button id="touchChannels" type="button" aria-controls="strip" aria-expanded="false">Kanallar</button>
    <button id="touchNext" type="button" aria-label="Sonraki kanal">›</button>
  </nav>
  <aside id="categories" hidden aria-label="Kategoriler"><button id="closeCategories" class="menu-close" type="button" aria-label="Kategorileri kapat">×</button><div class="panel-title">Kategoriler <small>↑ ↓ seç · OK aç · 8 sn sonra kapanır</small></div><a class="settings-link" data-web-settings href="settings.html">⚙ Liste kaynağı ayarları</a><div id="categoryList"></div></aside>
  <section id="strip" hidden aria-label="Kanallar"><button id="closeChannels" class="menu-close" type="button" aria-label="Kanalları kapat">×</button><div class="strip-title"><span id="stripTitle"></span><small>← → seç · OK izle · Geri kapat · 8 sn</small></div><div id="channelList"></div></section>
  <footer id="help">← Önceki kanal <b>·</b> Sonraki kanal → <b>·</b> OK Kategoriler <b>·</b> ↓ Kanallar <b>·</b> F Tam ekran</footer>
</body>
</html>
